spring:
  application:
    name: agent-forge-backend
  profiles:
    active: local
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent_forge # 自己的数据库
    username: root # 自己的账号
    password: 1234 # 自己的密码
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 你的密码
      ttl: 3600  # 缓存过期时间（秒），一小时
      database: 0
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.baiye.agentforge.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


